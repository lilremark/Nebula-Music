# Keep this include in every location that declares add_header: NGINX does not
# inherit server headers when a location adds its own Cache-Control header.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
# User-configured Subsonic/radio endpoints may be HTTPS or LAN HTTP. React and
# motion use inline styles; scripts stay limited to the app's own bundled files.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' http: https: data: blob:; media-src 'self' http: https: blob: data:; connect-src 'self' http: https: ws://127.0.0.1:* ws://localhost:*; worker-src 'self' blob:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
