services:
  nebula-music:
    image: lilremark/nebula-music:${NEBULA_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${NEBULA_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
