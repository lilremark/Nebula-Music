server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/nebula-security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 204;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nebula-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/nebula-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/nebula-security-headers.conf;
    }
}
