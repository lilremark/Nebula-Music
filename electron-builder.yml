appId: com.nebula.desktop
productName: Nebula
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/main.cjs
  - electron/dist/preload.cjs
  - electron/dist/voiceWorker.cjs
  - electron/assets/**/*
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/onnxruntime-node/**/*"
  - "**/node_modules/echogarden/**/*"
  - "**/node_modules/@echogarden/**/*"
  - "**/node_modules/sharp/**/*"
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
  extraResources:
    - from: electron/aiDj/resources
      to: aiDj
      filter:
        - "llama/**/*"
        - "notices/**/*"
        - "NOTICE.md"
        - "manifest.json"

nsis:
  oneClick: true
  perMachine: false
appx:
  identityName: com.nebula.desktop
  publisherDisplayName: Nebula
  publisher: CN=Nebula
mac:
  icon: electron/assets/icon.icns
  category: public.app-category.music
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: lilremark
  repo: Nebula-Music
