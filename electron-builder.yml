appId: com.nebula.desktop
productName: Nebula
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - electron/assets/**/*
  - package.json
asar: true
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: true
  perMachine: false
appx:
  identityName: com.nebula.desktop
  publisherDisplayName: Nebula
  publisher: CN=Nebula
mac:
  icon: electron/assets/icon.icns
  category: public.app-category.music
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: lilremark
  repo: Nebula-Music
