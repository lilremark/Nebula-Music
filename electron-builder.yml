appId: com.nebula.desktop
productName: Nebula
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - electron/assets/**/*
  - package.json
asar: true
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: lilremark
  repo: Nebula-Music
