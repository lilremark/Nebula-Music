name: Stream Deck bridge

on:
  pull_request:
    paths:
      - ".github/workflows/stream-deck-bridge.yml"
      - "context/StreamDeckBridgeContext.tsx"
      - "services/streamDeck*"
      - "views/Settings.tsx"
      - "App.tsx"
      - "types.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stream-deck-bridge.yml"
      - "context/StreamDeckBridgeContext.tsx"
      - "services/streamDeck*"
      - "views/Settings.tsx"
      - "App.tsx"
      - "types.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: stream-deck-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build
