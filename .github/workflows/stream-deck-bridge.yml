name: App verification

on:
  pull_request:
    paths:
      - ".github/workflows/stream-deck-bridge.yml"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.html"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  push:
    branches:
      - main
      - beta
    paths:
      - ".github/workflows/stream-deck-bridge.yml"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.html"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: stream-deck-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build web and Electron bundles
        run: npm run build:electron

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate NGINX security headers
        run: |
          docker run --rm --entrypoint nginx \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/docker/security-headers.conf:/etc/nginx/nebula-security-headers.conf:ro" \
            nginxinc/nginx-unprivileged:1.30.3-alpine -t
