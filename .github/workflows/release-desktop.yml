name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      is-beta: ${{ steps.beta.outputs.is-beta }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate and expose version
        id: release-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/releaseVersion.mjs --tag "${GITHUB_REF_NAME}"
          else
            node scripts/releaseVersion.mjs
          fi
          version="$(node -p "require('./package.json').version")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Detect beta pre-release tag
        id: beta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            printf 'is-beta=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'is-beta=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - run: node scripts/releaseVersion.mjs --tag "v${RELEASE_VERSION}"
      - run: node scripts/releaseArtifacts.mjs --platform windows --version "${RELEASE_VERSION}" --dir release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            release/Nebula-${{ needs.verify.outputs.version }}-setup.exe
            release/Nebula-${{ needs.verify.outputs.version }}-setup.exe.blockmap
            release/Nebula-${{ needs.verify.outputs.version }}-setup.appx
            release/latest.yml
          if-no-files-found: error

  macos:
    name: Build macOS arm64
    if: needs.verify.outputs.is-beta != 'true'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - run: node scripts/releaseVersion.mjs --tag "v${RELEASE_VERSION}"
      - run: node scripts/releaseArtifacts.mjs --platform mac --version "${RELEASE_VERSION}" --dir release
      - name: Verify bundle
        run: |
          test "$(plutil -extract CFBundleShortVersionString raw release/mac-arm64/Nebula.app/Contents/Info.plist)" = "${RELEASE_VERSION}"
          file release/mac-arm64/Nebula.app/Contents/MacOS/Nebula | grep -q arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: |
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.dmg
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.dmg.blockmap
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.zip
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  draft-release:
    name: Assemble draft release
    if: github.ref_type == 'tag' && !cancelled() && needs.verify.result == 'success' && needs.windows.result == 'success'
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: false
      - run: node scripts/releaseArtifacts.mjs --platform windows --version "${RELEASE_VERSION}" --dir release-assets
      - if: needs.verify.outputs.is-beta != 'true'
        run: node scripts/releaseArtifacts.mjs --platform mac --version "${RELEASE_VERSION}" --dir release-assets
      - name: Write release caveats
        run: |
          if [[ "${{ needs.verify.outputs.is-beta }}" == "true" ]]; then
            cat > release-notes.md <<'EOF'
          ## Beta build

          This is a pre-release beta of Nebula. The Windows build is unsigned and may show a SmartScreen warning; updates download and install automatically once installed.

          Switch the update channel to Beta in Settings to receive this and future beta builds. Stable users are never offered pre-release builds.
          EOF
          else
            cat > release-notes.md <<'EOF'
          ## Installation notes

          Windows and macOS builds are unsigned. Windows may show SmartScreen warnings. On macOS, right-click Nebula and choose Open if Gatekeeper blocks the first launch.

          Windows updates download and install automatically. Unsigned macOS builds check for updates but open this GitHub release for manual DMG installation.
          EOF
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ needs.verify.outputs.is-beta == 'true' }}
          generate_release_notes: true
          body_path: release-notes.md
          files: release-assets/*/*
          fail_on_unmatched_files: true
      - if: needs.verify.outputs.is-beta == 'true'
        name: Publish beta pre-release
        run: gh release edit "v${RELEASE_VERSION}" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
