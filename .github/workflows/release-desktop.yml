# Builds and publishes a Nebula release from a v* tag: Windows and macOS
# installers, the web bundle, and the Docker Hub image. Release notes come from
# docs/release/v<version>.md (format: docs/release/README.md) and are the same
# notes the app shows in What's New. workflow_dispatch builds everything without
# publishing anything.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      is-beta: ${{ steps.beta.outputs.is-beta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate and expose version
        id: release-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/releaseVersion.mjs --tag "${GITHUB_REF_NAME}"
          else
            node scripts/releaseVersion.mjs
          fi
          version="$(node -p "require('./package.json').version")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Detect beta pre-release tag
        id: beta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            printf 'is-beta=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'is-beta=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Validate release notes
        run: node scripts/releaseNotes.mjs check --version "${{ steps.release-version.outputs.version }}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the web bundle has no source maps
        run: test -z "$(find dist -name '*.map' -print -quit)"
      - run: npm audit --audit-level=low
      - name: Package web bundle
        run: cd dist && zip -qr "../Nebula-${{ steps.release-version.outputs.version }}-web.zip" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release
          path: Nebula-${{ steps.release-version.outputs.version }}-web.zip
          if-no-files-found: error

  docker:
    name: Docker image (linux/amd64, linux/arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      IS_BETA: ${{ needs.verify.outputs.is-beta }}
      IMAGE: lilremark/nebula-music
      HAS_DOCKERHUB_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose image tags
        id: tags
        shell: bash
        run: |
          if [[ "${IS_BETA}" == "true" ]]; then
            tags="${IMAGE}:${RELEASE_VERSION},${IMAGE}:beta"
          else
            tags="${IMAGE}:${RELEASE_VERSION},${IMAGE}:${RELEASE_VERSION%.*},${IMAGE}:latest"
          fi
          push=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${HAS_DOCKERHUB_CREDENTIALS}" != "true" ]]; then
              echo "::error::Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish ${IMAGE}."
              exit 1
            fi
            push=true
          fi
          printf 'tags=%s\npush=%s\n' "${tags}" "${push}" >> "${GITHUB_OUTPUT}"
          echo "Image tags: ${tags} (push: ${push})"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ steps.tags.outputs.push == 'true' }}

  windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dj:assets
      # Crash reporting: release builds carry the Sentry DSN (reporting stays
      # off until the user opts in). Source maps are uploaded on tags only and
      # always deleted before packaging. The token is scoped to this step.
      - name: Package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && -z "${NEBULA_CRASH_DSN}" ]]; then
            echo "::error::Add the SENTRY_DSN repository secret to build crash reporting into release builds."
            exit 1
          fi
          npm run dist:win
        env:
          NEBULA_CRASH_DSN: ${{ secrets.SENTRY_DSN }}
          NEBULA_SOURCEMAPS: "1"
          NEBULA_SOURCEMAPS_UPLOAD: ${{ github.ref_type == 'tag' && '1' || '0' }}
          SENTRY_AUTH_TOKEN: ${{ github.ref_type == 'tag' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: remark-industries
          SENTRY_PROJECT: nebula-music
      - run: npm run test:desktop
      - run: npm run test:dj-platforms
      - run: node scripts/releaseVersion.mjs --tag "v${RELEASE_VERSION}"
      - run: node scripts/releaseArtifacts.mjs --platform windows --version "${RELEASE_VERSION}" --dir release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/Nebula-${{ needs.verify.outputs.version }}-setup.exe
            release/Nebula-${{ needs.verify.outputs.version }}-setup.exe.blockmap
            release/Nebula-${{ needs.verify.outputs.version }}-setup.appx
            release/latest.yml
          if-no-files-found: error

  macos:
    name: Build macOS arm64
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      # See the Windows job's Package step.
      - name: Package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && -z "${NEBULA_CRASH_DSN}" ]]; then
            echo "::error::Add the SENTRY_DSN repository secret to build crash reporting into release builds."
            exit 1
          fi
          npm run dist:mac
        env:
          NEBULA_CRASH_DSN: ${{ secrets.SENTRY_DSN }}
          NEBULA_SOURCEMAPS: "1"
          NEBULA_SOURCEMAPS_UPLOAD: ${{ github.ref_type == 'tag' && '1' || '0' }}
          SENTRY_AUTH_TOKEN: ${{ github.ref_type == 'tag' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: remark-industries
          SENTRY_PROJECT: nebula-music
      - run: npm run test:desktop
      - run: npm run test:dj-platforms
      - run: node scripts/releaseVersion.mjs --tag "v${RELEASE_VERSION}"
      - run: node scripts/releaseArtifacts.mjs --platform mac --version "${RELEASE_VERSION}" --dir release
      - name: Verify bundle
        run: |
          test "$(plutil -extract CFBundleShortVersionString raw release/mac-arm64/Nebula.app/Contents/Info.plist)" = "${RELEASE_VERSION}"
          file release/mac-arm64/Nebula.app/Contents/MacOS/Nebula | grep -q arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.dmg
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.dmg.blockmap
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.zip
            release/Nebula-${{ needs.verify.outputs.version }}-arm64.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  draft-release:
    name: Assemble GitHub release
    if: github.ref_type == 'tag' && !cancelled() && needs.verify.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success'
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - run: node scripts/releaseArtifacts.mjs --platform windows --version "${RELEASE_VERSION}" --dir release-assets
      - run: node scripts/releaseArtifacts.mjs --platform mac --version "${RELEASE_VERSION}" --dir release-assets
      - run: test -f "release-assets/Nebula-${RELEASE_VERSION}-web.zip"
      - name: Write release notes
        run: |
          node scripts/releaseNotes.mjs github --version "${RELEASE_VERSION}" > release-notes.md
          printf '\n' >> release-notes.md
          if [[ "${{ needs.verify.outputs.is-beta }}" == "true" ]]; then
            cat >> release-notes.md <<'EOF'
          ## Beta build

          This is a pre-release beta of Nebula for Windows x64 and macOS Apple Silicon (arm64). Both builds are unsigned. Windows may show a SmartScreen warning; updates download and install automatically once installed.

          macOS builds are not notarized and may be blocked by Gatekeeper. macOS updates open the GitHub release for manual DMG installation. Local AI DJ currently requires Windows x64.

          Switch the update channel to Beta in Settings to receive this and future beta builds. Stable users are never offered pre-release builds.
          EOF
          else
            cat >> release-notes.md <<'EOF'
          ## Installation notes

          Windows and macOS builds are unsigned. Windows may show SmartScreen warnings. On macOS, right-click Nebula and choose Open if Gatekeeper blocks the first launch.

          Windows updates download and install automatically. Unsigned macOS builds check for updates but open this GitHub release for manual DMG installation.
          EOF
          fi
          printf '\nDocker: `docker pull lilremark/nebula-music:%s`. The web bundle `Nebula-%s-web.zip` can be served by any static host.\n' \
            "${RELEASE_VERSION}" "${RELEASE_VERSION}" >> release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Nebula ${{ needs.verify.outputs.version }}
          draft: true
          prerelease: ${{ needs.verify.outputs.is-beta == 'true' }}
          generate_release_notes: true
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
      - if: needs.verify.outputs.is-beta == 'true'
        name: Publish beta pre-release
        run: gh release edit "v${RELEASE_VERSION}" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  # Links the release's commits in Sentry (suspect commits) and finalizes it.
  # Betas are published above, so their deploy is recorded here; stable drafts
  # are published by hand, which records the deploy in sentry-deploy.yml.
  sentry-release:
    name: Finalize Sentry release
    if: github.ref_type == 'tag' && !cancelled() && needs.draft-release.result == 'success'
    needs: [verify, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Only sentry-cli is needed; no install scripts run while the token is unset.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Finalize release
        run: node scripts/sentryRelease.mjs finalize --version "${RELEASE_VERSION}" ${{ needs.verify.outputs.is-beta == 'true' && '--deploy' || '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: remark-industries
          SENTRY_PROJECT: nebula-music
